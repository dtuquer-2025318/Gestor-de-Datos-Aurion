<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURION - Acceso al Sistema</title>
</head>
<body>

  <div class="login-container min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="width: 100%; max-width: 440px;">
      
      <div class="card-header-bg text-center p-4">
        <div class="icon-logo mx-auto mb-3">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3 class="fw-bold text-white mb-1">AURION</h3>
        <p class="text-white-50 fs-7 mb-0">Plataforma de Gestión de Datos</p>
      </div>

      <div class="p-4 p-sm-5 bg-white">
        
        <div *ngIf="errorMessage" class="alert-error mb-4 d-flex align-items-center gap-2" role="alert">
          <i class="bi bi-exclamation-circle-fill fs-5"></i>
          <span class="fs-7 fw-medium">{{ errorMessage }}</span>
        </div>

        <form (ngSubmit)="onSubmit()" class="d-flex flex-column gap-3">
          
          <div *ngIf="isRegisterMode" class="form-group">
            <label class="form-label fs-7 fw-semibold text-secondary mb-1">Nombre Completo</label>
            <div class="input-wrapper">
              <i class="bi bi-person input-icon"></i>
              <input 
                type="text" 
                class="form-control form-input" 
                placeholder="Ej. Alexander Tuquer" 
                [(ngModel)]="name" 
                name="name" 
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label fs-7 fw-semibold text-secondary mb-1">Correo Electrónico</label>
            <div class="input-wrapper">
              <i class="bi bi-envelope input-icon"></i>
              <input 
                type="email" 
                class="form-control form-input" 
                placeholder="nombre@aurion.com" 
                [(ngModel)]="email" 
                name="email" 
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label fs-7 fw-semibold text-secondary mb-1">Contraseña</label>
            <div class="input-wrapper">
              <i class="bi bi-lock input-icon"></i>
              <input 
                type="password" 
                class="form-control form-input" 
                placeholder="••••••••" 
                [(ngModel)]="password" 
                name="password" 
                required
              />
            </div>
          </div>

          <button 
            type="submit" 
            class="btn btn-primary-action w-100 mt-2 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2" 
            [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
            <span>{{ isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión' }}</span>
            <i *ngIf="!loading" class="bi bi-arrow-right fs-6"></i>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="mb-0 fs-7 text-muted">
            {{ isRegisterMode ? '¿Ya estás registrado?' : '¿Aún no tienes cuenta?' }}
            <button 
              type="button" 
              class="btn btn-link text-brand p-0 ms-1 fw-bold text-decoration-none fs-7" 
              (click)="toggleMode()">
              {{ isRegisterMode ? 'Inicia Sesión' : 'Regístrate' }}
            </button>
          </p>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
